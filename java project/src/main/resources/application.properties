spring.application.name=study-planner-api

# H2 is an embedded database. This uses a new project-local file so an older,
# locked study-planner database cannot block startup. AUTO_SERVER allows H2 to
# coordinate connections from the application and H2 console safely.
spring.datasource.url=jdbc:h2:file:./data/study-planner-api;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Visit http://localhost:8080/h2-console after starting the application.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
